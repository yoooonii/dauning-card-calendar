<script>
(()=>{'use strict';
const conf=window.CARD_CALENDAR_CONFIG||{};const q=id=>document.getElementById(id);const cards=[{id:'BC 법인카드',cls:'bc'},{id:'공용 법인카드',cls:'common'},{id:'밀로티 법인카드',cls:'miloti'}];
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR')+'원';const pad=n=>String(n).padStart(2,'0');const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;const today=new Date();let year=today.getFullYear(),month=today.getMonth(),selected=ymd(year,month,today.getDate()),records=[],filters=new Set(cards.map(c=>c.id)),client,user,realtimeChannel;
const cls=x=>cards.find(c=>c.id===x)?.cls||'common';const entrySum=r=>r.reduce((s,e)=>s+Number(e.amount),0);let limits={},limitsAvailable=true,entryPage=1;const selectedRows=()=>records.filter(r=>r.used_date===selected&&filters.has(r.card_type));
function notify(msg){alert(msg)}function closeModal(){q('overlay').classList.add('hide');q('modalContent').innerHTML=''}function showModal(html){q('modalContent').innerHTML=html;q('overlay').classList.remove('hide')}
q('overlay').addEventListener('click',e=>{if(e.target===q('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function renderLegend(){q('legend').innerHTML=cards.map(c=>`<button class="chip ${filters.has(c.id)?'':'off'}" data-filter="${c.id}"><i class="dot ${c.cls}"></i>${c.id}</button>`).join('');q('legend').querySelectorAll('button').forEach(b=>b.onclick=()=>{let name=b.dataset.filter;filters.has(name)?filters.delete(name):filters.add(name);entryPage=1;render()})}
function render(){renderSummary();q('monthTitle').textContent=`${year}년 ${month+1}월`;renderLegend();const offset=new Date(year,month,1).getDay(),length=new Date(year,month+1,0).getDate(),cells=Math.ceil((offset+length)/7)*7;let html='';for(let i=0;i<cells;i++){let d=i-offset+1;if(d<1||d>length){html+='<div class="day empty"></div>';continue}let key=ymd(year,month,d),rs=records.filter(r=>r.used_date===key&&filters.has(r.card_type)),selectedClass=selected===key?'selected':'',todayClass=key===ymd(today.getFullYear(),today.getMonth(),today.getDate())?'today':'';const amounts=cards.filter(c=>filters.has(c.id)).map(c=>{const sum=entrySum(rs.filter(r=>r.card_type===c.id));return sum?`<div class="amountrow"><i class="dot ${c.cls}"></i><span>${fmt(sum)}</span></div>`:''}).join('');html+=`<button class="day ${selectedClass} ${todayClass} ${i%7===0?'sunday':i%7===6?'saturday':''}" data-date="${key}"><span class="daynum">${d}</span>${amounts}${rs.length?`<span class="daytotal">합계 ${fmt(entrySum(rs))}</span>`:''}</button>`}q('days').innerHTML=html;q('days').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;entryPage=1;render()});renderSide()}
function renderSide(){
 const rs=selectedRows(), pages=Math.max(1,Math.ceil(rs.length/6));
 entryPage=Math.max(1,Math.min(entryPage,pages));
 const visible=rs.slice((entryPage-1)*6,entryPage*6);
 q('selectedTitle').textContent=`${Number(selected.slice(5,7))}월 ${Number(selected.slice(8))}일`;
 q('selectedTotal').textContent=`${rs.length}건 · ${fmt(entrySum(rs))}`;
 q('entries').innerHTML=visible.length?visible.map(r=>`<div class="entry" data-id="${r.id}"><button class="entrymain" data-open="${r.id}"><div class="entrycardline"><span class="entrycardname"><i class="dot ${cls(r.card_type)}"></i>${escapeHtml(r.card_type)}</span><span class="entryauthor">${escapeHtml(r.author||'')}</span></div><div class="entryamount">${fmt(r.amount)}</div><div class="entrypurpose">${escapeHtml(r.purpose||r.merchant||'-')}</div></button><button class="receiptButton" data-receipt="${r.id}" title="이미지 보기 / 첨부" aria-label="이미지 보기 / 첨부">▤</button></div>`).join(''):'<div class="emptyText">이 날짜에 등록된 내역이 없습니다.<br>내역 추가 버튼으로 기록해 주세요.</div>';
 q('entries').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(records.find(r=>r.id===b.dataset.open)));
 q('entries').querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>openReceipt(records.find(r=>r.id===b.dataset.receipt)));
 q('entryPager').innerHTML=pages>1?`<button type="button" id="pagePrev" ${entryPage===1?'disabled':''} aria-label="이전 내역 페이지">‹</button><span>${entryPage} / ${pages}</span><button type="button" id="pageNext" ${entryPage===pages?'disabled':''} aria-label="다음 내역 페이지">›</button>`:'';
 if(pages>1){q('pagePrev').onclick=()=>{entryPage--;renderSide()};q('pageNext').onclick=()=>{entryPage++;renderSide()}}
}
function renderSummary(){
 q('summary').innerHTML=cards.map(c=>{const rs=records.filter(r=>r.card_type===c.id),spent=entrySum(rs),limit=limits[c.id],hasLimit=limit!==undefined&&limit!==null;
 return `<div class="summarycard"><div class="summaryname"><i class="dot ${c.cls}"></i><b>${c.id}</b><button class="limitbtn" data-limit="${c.id}" title="월 한도 수정">한도 설정 ⚙</button></div><div class="summaryspent">${fmt(spent)}</div><div class="summarycounts">사용 ${rs.length}건</div><div class="summarybottom"><span>월 한도 ${hasLimit?fmt(limit):'미설정'}</span><strong>잔액 ${hasLimit?fmt(limit-spent):'-'}</strong></div></div>`}).join('');
 q('summary').querySelectorAll('[data-limit]').forEach(b=>b.onclick=()=>openLimit(b.dataset.limit));
}
function numberFormat(value){const digits=String(value||'').replace(/[^0-9]/g,'');return digits?Number(digits).toLocaleString('ko-KR'):''}
function bindMoney(input){input.addEventListener('input',()=>{const raw=input.value.replace(/[^0-9]/g,'');input.value=numberFormat(raw)})}
async function loadLimits(){limits={};const period=ymd(year,month,1);const {data,error}=await client.from('card_monthly_limits').select('card_type,limit_amount').eq('period',period);
 if(error){limitsAvailable=false;console.warn('월 한도 테이블이 아직 준비되지 않았습니다.',error.message);return}
 limitsAvailable=true;for(const x of data||[])limits[x.card_type]=Number(x.limit_amount);
}
function openLimit(card){if(!limitsAvailable){notify('월 한도 저장 기능을 사용하려면 ZIP에 포함된 월한도_SQL설정.sql을 Supabase SQL Editor에서 한 번 실행해 주세요.');return}
 const value=limits[card]??'';showModal(`<h2>월 한도 설정</h2><p class="sub">${year}년 ${month+1}월 · ${escapeHtml(card)}</p><form id="limitForm"><div class="field"><label>월 한도 금액 (원)</label><input id="limitAmount" type="text" inputmode="numeric" value="${value===''?'':numberFormat(value)}" placeholder="1,000,000" required/></div><div class="actions"><button class="ghost" type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div></form>`);
 bindMoney(q('limitAmount'));q('cancel').onclick=closeModal;q('limitForm').onsubmit=async e=>{e.preventDefault();const amount=Number(q('limitAmount').value.replace(/,/g,''));if(!Number.isSafeInteger(amount)||amount<0){notify('한도를 확인해 주세요.');return}const {error}=await client.from('card_monthly_limits').upsert({period:ymd(year,month,1),card_type:card,limit_amount:amount},{onConflict:'period,card_type'});if(error){notify('한도 저장 오류: '+error.message);return}limits[card]=amount;closeModal();renderSummary()};
}

async function refresh(){let first=ymd(year,month,1),last=ymd(year,month,new Date(year,month+1,0).getDate());let {data,error}=await client.from('card_entries').select('*').gte('used_date',first).lte('used_date',last).order('created_at',{ascending:true});if(error){console.error(error);notify('목록을 불러오지 못했습니다: '+error.message);return}records=data||[];await loadLimits();render()}
function move(delta){month+=delta;if(month<0){month=11;year--}if(month>11){month=0;year++}selected=ymd(year,month,1);entryPage=1;refresh()}
function editForm(row){const r=row||{};showModal(`<h2>${row?'내역 수정':'카드 사용 내역 추가'}</h2><form id="expenseForm"><div class="formgrid"><div class="field"><label>사용 날짜 *</label><input type="date" name="used_date" required value="${escapeHtml(r.used_date||selected)}"/></div></div><div class="field"><label>카드 종류 *</label><select name="card_type">${cards.map(c=>`<option ${r.card_type===c.id?'selected':''}>${c.id}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>사용 금액 (원) *</label><div class="moneywrap"><input id="amountInput" type="text" inputmode="numeric" required name="amount" value="${r.amount?numberFormat(r.amount):''}" placeholder="1,000"/><span>원</span></div></div><div class="field"><label>작성자 *</label><input name="author" required maxlength="80" value="${escapeHtml(r.author||'')}" placeholder="이름"/></div></div><div class="field"><label>사용처 *</label><input name="merchant" maxlength="150" required placeholder="매장명 / 업체명" value="${escapeHtml(r.merchant||'')}"/></div><div class="field"><label>사용 목적</label><input name="purpose" maxlength="180" placeholder="구매 내용, 사용 목적" value="${escapeHtml(r.purpose||'')}"/></div><div class="field"><label>비고</label><textarea name="memo" maxlength="1500">${escapeHtml(r.memo||'')}</textarea></div><div class="field"><label>영수증 / 관련 이미지 (5MB 이하, JPG·PNG·WebP)</label><input id="receipt" type="file" accept="image/png,image/jpeg,image/webp"/><div id="pasteZone" class="pasteZone" tabindex="0">이미지를 복사한 뒤 여기를 클릭하고 Ctrl + V로 붙여넣으세요.<div id="pastePreview"></div></div></div>${row&&r.receipt_path?'<div class="notice">새 파일을 선택하지 않으면 기존 첨부파일이 유지됩니다.</div>':''}<div class="actions"><button type="button" class="ghost" id="cancel">취소</button><button type="submit" class="primary" id="save">저장</button></div></form>`);q('cancel').onclick=closeModal;bindMoney(q('amountInput'));let pastedFile=null;
 const zone=q('pasteZone');const input=q('receipt');
 function previewFile(file){if(!file||!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file);q('pastePreview').innerHTML='';const img=document.createElement('img');img.src=url;img.alt='붙여넣은 이미지';img.onload=()=>URL.revokeObjectURL(url);q('pastePreview').append(img)}
 zone.onpaste=e=>{const img=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(!img)return;e.preventDefault();pastedFile=img.getAsFile();previewFile(pastedFile)};
 input.onchange=()=>{pastedFile=null;if(input.files[0])previewFile(input.files[0])};
 q('expenseForm').onsubmit=async e=>{e.preventDefault();q('save').disabled=true;const fd=new FormData(e.currentTarget);const expense={used_date:fd.get('used_date'),card_type:fd.get('card_type'),amount:Number(String(fd.get('amount')).replace(/,/g,'')),author:String(fd.get('author')).trim(),merchant:String(fd.get('merchant')).trim(),purpose:String(fd.get('purpose')).trim(),memo:String(fd.get('memo')).trim()};if(!expense.merchant||!expense.author||!Number.isSafeInteger(expense.amount)||expense.amount<=0){notify('필수 항목을 입력해 주세요.');q('save').disabled=false;return}try{let file=pastedFile||q('receipt').files[0],newPath=null;if(file){if(file.size>5*1024*1024)throw new Error('첨부 파일은 5MB 이하여야 합니다.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('지원하지 않는 파일 형식입니다.');const extension=({ 'image/png':'png','image/jpeg':'jpg','image/webp':'webp'})[file.type];newPath=`shared/${crypto.randomUUID()}.${extension}`;const uploaded=await client.storage.from('card-images').upload(newPath,file,{contentType:file.type});if(uploaded.error)throw uploaded.error;expense.receipt_path=newPath}let result=row?await client.from('card_entries').update(expense).eq('id',row.id):await client.from('card_entries').insert(expense);if(result.error){if(newPath)await client.storage.from('card-images').remove([newPath]);throw result.error}selected=expense.used_date;const dt=new Date(expense.used_date+'T12:00:00');year=dt.getFullYear();month=dt.getMonth();closeModal();await refresh()}catch(error){notify('저장하지 못했습니다: '+error.message);q('save').disabled=false}}}
async function openReceipt(r){if(!r)return;if(!r.receipt_path){editForm(r);setTimeout(()=>q('pasteZone')?.focus(),0);return}const {data,error}=await client.storage.from('card-images').createSignedUrl(r.receipt_path,120);if(error){notify('이미지를 열지 못했습니다: '+error.message);return}const url=data.signedUrl;showModal(`<div class="receiptHeader"><b>첨부 이미지</b><button class="ghost" id="closeReceipt">닫기 ✕</button></div><div class="receiptCanvas"><img class="receiptFull" src="${escapeHtml(url)}" alt="첨부 이미지"/></div><div class="actions"><button class="ghost" id="editReceipt">이미지 변경</button></div>`);q('closeReceipt').onclick=closeModal;q('editReceipt').onclick=()=>editForm(r)}
async function openDetail(r){if(!r)return;showModal(`<h2>카드 사용 상세</h2><div class="detailrow"><span>카드 종류</span><span><i class="dot ${cls(r.card_type)}" style="display:inline-block;margin-right:8px"></i>${escapeHtml(r.card_type)}</span></div><div class="detailrow"><span>사용 금액</span><span><b>${fmt(r.amount)}</b></span></div><div class="detailrow"><span>사용 일시</span><span>${escapeHtml(r.used_date)} </span></div><div class="detailrow"><span>사용처</span><span>${escapeHtml(r.merchant)}</span></div><div class="detailrow"><span>사용 목적</span><span>${escapeHtml(r.purpose||'-')}</span></div><div class="detailrow"><span>작성자</span><span>${escapeHtml(r.author||'-')}</span></div><div class="detailrow"><span>비고</span><span>${escapeHtml(r.memo||'-')}</span></div><div id="attachment" class="field" style="margin-top:15px"></div><div class="actions"><button class="danger" id="remove">삭제</button><button class="ghost" id="cancel">닫기</button><button class="primary" id="edit">수정</button></div>`);q('cancel').onclick=closeModal;q('edit').onclick=()=>editForm(r);q('remove').onclick=async()=>{if(!confirm('이 사용 내역을 삭제하시겠습니까?'))return;const result=await client.from('card_entries').delete().eq('id',r.id);if(result.error){notify(result.error.message);return}if(r.receipt_path)await client.storage.from('card-images').remove([r.receipt_path]);closeModal();refresh()};if(r.receipt_path){let {data,error}=await client.storage.from('card-images').createSignedUrl(r.receipt_path,60);if(error){q('attachment').textContent='첨부파일을 열 수 없습니다.'}else{const url=data.signedUrl;q('attachment').innerHTML=`<label>첨부파일</label><img class="imagePreview" alt="첨부된 영수증" src="${escapeHtml(url)}"><button class="ghost" id="bigReceipt">이미지 크게 보기</button>`}q('bigReceipt')?.addEventListener('click',()=>openReceipt(r))}}
async function init(){
  if(!conf.supabaseUrl||!conf.supabaseAnonKey||conf.supabaseUrl.includes('YOUR_')){
    q('login').classList.remove('hide');
    q('login').innerHTML='<h1>초기 설정이 필요합니다</h1><p>config.js에 Supabase URL과 공개 키를 입력해 주세요.</p>';
    return;
  }
  client=window.supabase.createClient(conf.supabaseUrl,conf.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  await enter();
}
async function enter(){
  q('login').classList.add('hide');q('app').classList.remove('hide');
  q('prev').onclick=()=>move(-1);q('next').onclick=()=>move(1);q('add').onclick=()=>editForm();
  await refresh();
  if(realtimeChannel)client.removeChannel(realtimeChannel);
  realtimeChannel=client.channel('expenses-updates').on('postgres_changes',{event:'*',schema:'public',table:'card_entries'},()=>refresh()).subscribe();
}
init();
})();
</script></body></html>
